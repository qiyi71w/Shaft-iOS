name: Build unsigned IPA
on:
  workflow_dispatch:
    inputs:
      deployment_target:
        description: "IPHONEOS_DEPLOYMENT_TARGET override (empty = project default)"
        required: false
        default: ""

jobs:
  build:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4

      - name: Xcode info
        run: xcodebuild -version

      - name: Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Build (no signing)
        env:
          DT: ${{ inputs.deployment_target }}
        run: |
          set -o pipefail
          EXTRA=()
          if [ -n "$DT" ]; then EXTRA+=("IPHONEOS_DEPLOYMENT_TARGET=$DT"); fi
          xcodebuild -project Shaft-iOS.xcodeproj -scheme Shaft-iOS \
            -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            "${EXTRA[@]}" \
            build 2>&1 | tee build.log

      - name: Collect errors
        if: always()
        run: |
          grep -E ': error: ' build.log | sort -u > errors.txt || true
          echo "unique errors: $(wc -l < errors.txt)"
          head -100 errors.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: |
            build.log
            errors.txt

      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/*.app Payload/
          zip -qry Shaft-unsigned.ipa Payload
          ls -lh Shaft-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Shaft-unsigned-ipa
          path: Shaft-unsigned.ipa

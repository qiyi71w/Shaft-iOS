name: Build unsigned IPA
on:
  workflow_dispatch:
    inputs:
      deployment_target:
        description: "IPHONEOS_DEPLOYMENT_TARGET override (empty = project default)"
        required: false
        default: ""

jobs:
  build:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4

      - name: Xcode info
        run: xcodebuild -version

      - name: Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Build (no signing)
        env:
          DT: ${{ inputs.deployment_target }}
        run: |
          set -o pipefail
          EXTRA=()
          if [ -n "$DT" ]; then EXTRA+=("IPHONEOS_DEPLOYMENT_TARGET=$DT"); fi
          xcodebuild -project Shaft-iOS.xcodeproj -scheme Shaft-iOS \
            -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            "${EXTRA[@]}" \
            build 2>&1 | tee build.log

      - name: Collect errors
        if: always()
        run: |
          grep -E ': error: ' build.log | sort -u > errors.txt || true
          echo "unique errors: $(wc -l < errors.txt)"
          head -100 errors.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: |
            build.log
            errors.txt

      - name: Check linkage
        run: |
          APP=$(ls -d build/Build/Products/Release-iphoneos/*.app)
          BIN="$APP/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist")"
          /usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$APP/Info.plist"
          otool -l "$BIN" | awk '/cmd LC_LOAD/{cmd=$2} /name /{print cmd, $2}' | tee linkage.txt
          # Translation.framework ships in iOS 17.4; a strong link crashes 17.0–17.3 at launch.
          if grep -E '^LC_LOAD_DYLIB .*Translation' linkage.txt; then echo "Translation is strongly linked"; exit 1; fi

      - name: Package IPA (fakesigned with keychain entitlements)
        run: |
          brew install ldid
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/*.app Payload/
          APP=$(ls -d Payload/*.app)
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")
          BIN="$APP/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist")"
          cat > ent.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>application-identifier</key><string>SHAFTLOCAL.$BUNDLE_ID</string>
            <key>keychain-access-groups</key><array><string>SHAFTLOCAL.$BUNDLE_ID</string></array>
          </dict></plist>
          EOF
          ldid -Sent.plist "$BIN"
          ldid -e "$BIN"
          zip -qry Shaft-unsigned.ipa Payload
          ls -lh Shaft-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Shaft-unsigned-ipa
          path: Shaft-unsigned.ipa
